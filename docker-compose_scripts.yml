services:
  scripts:
    image: uclalibrary/archivesspace-toolkit:latest
    user: "${ASPACE_UID}:${ASPACE_GID}"
    # Specifically needed with linux host, as docker runs natively there.
    # If using this compose file on a mac or windows host (including WSL),
    # remove the network_mode line. You'll probably also need to add
    # extra_hosts with "host.docker.internal:host-gateway".
    network_mode: "host"
    environment:
      - HOME=/home/aspace
    volumes:
      - ${ASPACE_DATA_DIR}/secrets:/home/aspace/app/secrets
      - ${ASPACE_DATA_DIR}/logs:/home/aspace/app/logs
      - ${ASPACE_DATA_DIR}/output:/home/aspace/app/output
